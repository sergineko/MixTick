name: mixtick
description: Aplicación móvil MixTick para cocinar, compartir y organizar la compra.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5
  flutter: '>=3.47.7'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: 3.4.3
  go_router: 18.0.2
  supabase_flutter: 2.18.3
  app_links: 7.2.2
  flutter_secure_storage: 11.2.0
  image_picker: 1.2.2
  image: 4.12.0
  http: 1.6.0
  intl: ^0.20.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  generate: true
